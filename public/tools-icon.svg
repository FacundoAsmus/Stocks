<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tools</title>
  <defs>
    <!-- Cuts a clean gap in the wrench where the screwdriver crosses it -->
    <mask id="tool-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g transform="translate(32 32) rotate(45) scale(1.15)" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round">
        <rect x="-4.5" y="9" width="9" height="19" rx="4"/>
        <rect x="-1.5" y="-22" width="3" height="32"/>
        <path d="M-1.5 -22L-3.2 -28H3.2L1.5 -22Z"/>
      </g>
    </mask>
  </defs>

  <!-- Wrench (head top-left, handle bottom-right) -->
  <g mask="url(#tool-gap)">
    <g transform="translate(32 32) rotate(-45) scale(1.15)" fill="#000">
      <path d="M-4.5 -27.37A9.5 9.5 0 1 0 4.5 -27.37L4.5 -19H-4.5Z"/>
      <path d="M-3 -12V21A3 3 0 0 0 3 21V-12Z"/>
    </g>
  </g>

  <!-- Screwdriver (tip top-right, handle bottom-left) -->
  <g transform="translate(32 32) rotate(45) scale(1.15)" fill="#000">
    <rect x="-4.5" y="9" width="9" height="19" rx="4"/>
    <rect x="-1.5" y="-22" width="3" height="32"/>
    <path d="M-1.5 -22L-3.2 -28H3.2L1.5 -22Z"/>
  </g>
</svg>
