<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Circuit board</title>
  <defs>
    <!-- Traces and pad rings are cut out of the solid board -->
    <mask id="traces" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#ADFA1B"/>
      <g fill="none" stroke="#ADFA1B" stroke-width="3" stroke-linejoin="round">
        <path d="M15 17H27L33 23H49"/>
        <path d="M15 32H49"/>
        <path d="M15 47H27L33 41H49"/>
      </g>
      <g fill="#ADFA1B">
        <circle cx="15" cy="17" r="4"/>
        <circle cx="49" cy="23" r="4"/>
        <circle cx="15" cy="32" r="4"/>
        <circle cx="49" cy="32" r="4"/>
        <circle cx="15" cy="47" r="4"/>
        <circle cx="49" cy="41" r="4"/>
      </g>
    </mask>
  </defs>

  <!-- Board -->
  <rect x="6" y="6" width="52" height="52" rx="6" fill="#ADFA1B" mask="url(#traces)"/>

  <!-- Pad centers -->
  <g fill="#ADFA1B">
    <circle cx="15" cy="17" r="2"/>
    <circle cx="49" cy="23" r="2"/>
    <circle cx="15" cy="32" r="2"/>
    <circle cx="49" cy="32" r="2"/>
    <circle cx="15" cy="47" r="2"/>
    <circle cx="49" cy="41" r="2"/>
  </g>
</svg>
